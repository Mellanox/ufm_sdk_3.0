---
job: ufm-state-mirror-release

registry_host: harbor.mellanox.com
registry_path: /swx-storage/ci-demo
registry_auth: swx-storage
step_allow_single_selector: true

credentials:
  # harbor login/password
  - {credentialsId: '425bb907-c357-4fde-92e0-67854a857b4f', usernameVariable: 'UFM_USER', passwordVariable: 'UFM_PASS'}

volumes:
  - {mountPath: /var/run/docker.sock, hostPath: /var/run/docker.sock}
  - {mountPath: /auto/mswg, hostPath: /auto/mswg}

runs_on_dockers:
  - {url: 'nbu-harbor.gtm.nvidia.com/ufm/ci/dind_ufm_x86_64:20251224', name: 'docker_builder', arch: 'x86_64', category: 'tool', nodeLabel: 'SWX-CI-DOCKER'}

steps:
  - name: Build StateMirror
    agentSelector: "{nodeLabel: 'SWX-CI-DOCKER'}"
    run: |
      set -x
      if [ "${PLUGIN_NAME}" != "ufm-state-mirror" ]; then
        echo -e "Error: ufm-state-mirror release matrix requires PLUGIN_NAME=ufm-state-mirror."
        echo -e "PLUGIN_NAME: ${PLUGIN_NAME}"
        exit 1
      fi

      RELEASE_ROOT="/auto/mswg/release/ufm/ufm-state-mirror"
      bash -x ufm-state-mirror/.ci/release_build.sh "${PLUGIN_VERSION}" "${RELEASE_ROOT}"
      BUILD_EXIT_CODE=$?
      ls -l "${RELEASE_ROOT}" || true
      if [ $BUILD_EXIT_CODE -ne 0 ];then
        echo -e "Error: Docker build failed in ufm-state-mirror/.ci/release_build.sh"
      fi
      exit ${BUILD_EXIT_CODE}

    parallel: false
